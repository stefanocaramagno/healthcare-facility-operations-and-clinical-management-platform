# File: frontend/nginx.conf
#
# Scopo
# -----
# Configurare Nginx come web server del frontend statico e come reverse proxy
# per le richieste API dirette all'API Gateway.
#
# Ruolo nel sistema
# -----------------
# Questo file governa il comportamento del container frontend, definendo:
# - la pubblicazione delle risorse statiche;
# - la gestione delle pagine di errore;
# - il forwarding delle richieste /api/* verso il gateway;
# - le policy di cache per le diverse tipologie di risorse.
#
# Note
# ----
# - Il browser comunica con il frontend come unico origin applicativo.
# - Le chiamate API vengono inoltrate internamente al servizio api-gateway.
# - Le risorse statiche sono trattate con policy di cache differenziate
#   in base alla loro natura.

server {
  # Porta HTTP esposta da Nginx all'interno del container frontend.
  listen 80;

  # Server name wildcard, adatto a un contesto locale/containerizzato
  # in cui non è richiesto un virtual host nominativo specifico.
  server_name _;

  # Directory root da cui Nginx serve i file statici del frontend.
  root /usr/share/nginx/html;

  # File predefinito da cercare come entry point.
  index index.html;

  # Limite massimo per il corpo della richiesta.
  # Utile, ad esempio, per upload o allegati gestiti lato frontend/API.
  client_max_body_size 20m;

  # Mappatura delle principali pagine di errore personalizzate del frontend.
  error_page 404 /_errors/404.html;
  error_page 403 /_errors/403.html;
  error_page 401 /_errors/session-expired.html;

  location /api/ {
    # Inoltra tutte le richieste API verso il servizio api-gateway,
    # che rappresenta il punto di ingresso unico del backend.
    proxy_pass http://api-gateway:8000;

    # Usa HTTP/1.1 per il forwarding, mantenendo compatibilità
    # con le esigenze del reverse proxy e dei servizi downstream.
    proxy_http_version 1.1;

    # Propaga gli header utili all'identificazione della richiesta originale
    # e al tracciamento lato backend/gateway.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout di connessione breve verso il gateway,
    # così da fallire rapidamente in caso di backend non raggiungibile.
    proxy_connect_timeout 5s;

    # Timeout più estesi per invio e lettura, utili per endpoint
    # che possono richiedere più tempo, come alcune operazioni AI o workflow applicativi.
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location ^~ /_errors/ {
    # Serve esclusivamente file esistenti nella cartella errori;
    # in caso contrario restituisce 404.
    try_files $uri =404;

    # Disabilita la cache per le pagine di errore,
    # così da evitare la persistenza client di stati anomali.
    add_header Cache-Control "no-store" always;
  }

  location ^~ /components/ {
    # Espone i frammenti/componenti HTML solo se realmente presenti su filesystem.
    try_files $uri =404;

    # Evita il caching dei componenti HTML,
    # così da mantenere allineata la UI alle modifiche più recenti.
    add_header Cache-Control "no-store" always;
  }

  location ^~ /assets/ {
    # Serve asset statici come immagini o icone solo se esistenti.
    try_files $uri =404;

    # Applica una cache più lunga agli asset statici,
    # che tendono a cambiare meno frequentemente.
    expires 30d;
    add_header Cache-Control "public";
  }

  location ^~ /css/ {
    # Serve i file CSS solo se presenti.
    try_files $uri =404;

    # Cache moderata per i fogli di stile, utile a migliorare le prestazioni
    # senza mantenere troppo a lungo versioni potenzialmente obsolete.
    expires 1h;
    add_header Cache-Control "public";
  }

  location ^~ /js/ {
    # Serve i file JavaScript solo se presenti.
    try_files $uri =404;

    # Cache moderata per gli script frontend,
    # bilanciando prestazioni e rapidità di aggiornamento.
    expires 1h;
    add_header Cache-Control "public";
  }

  location / {
    # Per tutte le altre richieste serve solo risorse realmente presenti;
    # non è previsto un fallback automatico a index.html.
    try_files $uri $uri/ =404;

    # Disabilita la cache per le pagine HTML principali,
    # così da evitare che il browser mantenga versioni non aggiornate dell'interfaccia.
    add_header Cache-Control "no-store" always;
  }
}
